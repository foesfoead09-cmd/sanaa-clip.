name: Build APK v2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android project
        run: flutter create --platforms=android --project-name sanaa_clip .
      - name: Configure android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n    <application#' $M
          sed -i 's/android:label="[^"]*"/android:label="صنعة كليب"/' $M
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f $f ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' $f
          done
          true
      - run: flutter pub get
      - name: Build APK
        run: |
          echo "android.lintOptions.checkReleaseBuilds=false" >> android/gradle.properties
          echo "android.lint.checkReleaseBuilds=false" >> android/gradle.properties
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sanaa-clip-apk
          path: build/app/outputs/flutter-apk/app-release.apk
